<svg width="600" height="800" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="vsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6efe2"/>
      <stop offset="60%" stop-color="#ebe0c6"/>
      <stop offset="100%" stop-color="#c5b287"/>
    </linearGradient>
    <linearGradient id="vink1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a6a6a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6a6a6a" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="vink2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a" stop-opacity="0.65"/>
