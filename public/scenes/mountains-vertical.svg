  <rect width="600" height="800" fill="url(#vsky)"/>

  <ellipse cx="150" cy="180" rx="220" ry="32" fill="#fff" opacity="0.55" filter="url(#vmist)"/>
  <ellipse cx="450" cy="280" rx="240" ry="36" fill="#fff" opacity="0.45" filter="url(#vmist)"/>

  <path d="M0,360 L80,300 L160,340 L240,260 L320,320 L400,250 L480,310 L560,270 L600,300 L600,800 L0,800 Z"
