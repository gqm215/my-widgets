name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 类型检查 / Lint / 测试 / 覆盖率
    runs-on: windows-latest
    defaults:
      run:
        working-directory: moji
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moji/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 质量门禁（tsc + eslint + vitest 覆盖率门槛）
        run: npm run verify
